appId: com.own-messenger.app
productName: Messenger
directories:
  output: release
files:
  - dist/**/*
  - src/renderer/**/*
  - src/picker/**/*
extraResources:
  - from: dist-native/window-chrome.node
    to: window-chrome.node
mac:
  category: public.app-category.social-networking
  icon: logo.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
