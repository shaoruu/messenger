<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Messenger</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Facebook's dark surfaces. --sidebar-edge is where its chat list ends, reported by the guest. */
    :root {
      --sidebar-color: #252728;
      --sidebar-divider: #303233;
      --thread-backdrop: #1c1c1d;
      --sidebar-edge: 0px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--thread-backdrop);
    }

    /* Until the page paints, mirror its split so the window opens in its final colors. */
    #webview-container {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        var(--sidebar-color) var(--sidebar-edge),
        var(--sidebar-divider) var(--sidebar-edge) calc(var(--sidebar-edge) + 1px),
        var(--thread-backdrop) calc(var(--sidebar-edge) + 1px)
      );
    }

    webview {
      position: absolute;
      inset: 0;
      border: none;
    }

    /* Sits over the top of the chat list, which the guest pushes down by the same 44px (TITLEBAR_HEIGHT in
       main.ts); with the list hidden it spans the window and the thread is pushed down instead. It stops short
       of the list's edge so the guest's resize handle (8px, centered on the edge) is reachable full height. */
    #titlebar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      /* The traffic lights are 14px tall at y 16 (trafficLightPosition in main.ts), so centered at 23px rather
         than the bar's 22px; this lines the button up with them. */
      padding-top: 2px;
      padding-left: 80px;
      background: var(--thread-backdrop);
      -webkit-app-region: drag;
    }

    body.has-sidebar #titlebar {
      width: calc(var(--sidebar-edge) - 4px);
      background: var(--sidebar-color);
    }

    /* No traffic lights to make room for in fullscreen. */
    body.fullscreen #titlebar {
      padding-left: 12px;
    }

    /* The thread's top margin is empty backdrop, so it doubles as a place to drag the window from. */
    #drag-strip {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 12px;
      -webkit-app-region: drag;
    }

    body.has-sidebar #drag-strip {
      left: calc(var(--sidebar-edge) + 4px);
    }

    /* Something of the page's, like the photo viewer, covers the window; the strip still lets it be dragged. */
    body.guest-overlay #titlebar {
      display: none;
    }

    body.guest-overlay #drag-strip {
      left: 0;
    }

    .titlebar-btn {
      -webkit-app-region: no-drag;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a8d91;
      transition: background 0.15s, color 0.15s;
    }

    .titlebar-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e4e6eb;
    }

    .titlebar-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    .titlebar-btn svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div id="webview-container">
    <webview
      id="messenger"
      src="https://www.facebook.com/messages"
      partition="persist:messenger"
      allowpopups
    ></webview>
  </div>
  <div id="drag-strip"></div>
  <div id="titlebar">
    <button id="sidebar" class="titlebar-btn" title="Toggle Sidebar (⌘B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <line x1="9" y1="4" x2="9" y2="20"></line>
      </svg>
    </button>
  </div>
  <script src="../../dist/renderer/renderer.js"></script>
</body>
</html>
